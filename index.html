<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fcfbff"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}body{margin:0}</style>
<title>Matkoll</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Nunito:wght@500..800&family=Patrick+Hand&display=swap">
<style>
/* A book of loose paper sheets: crayon colours, thick outlines, punched holes. Phone: a pile you scroll through. Laptop (1024+): sheets laid out on the table with a side menu. */
:root{--bg:#fcfbff;--paper:#ffffff;--paper2:#f3effa;--ink:#2a2438;--soft:#625c75;--line:#3a3350;--pen:#6243c9;--lila:#dccdf6;--on:#221c35;--good:#1d7a4b;--warn:#8a5a00;--bad:#c2243a;--sticky:#ffe27a;--hand:Fredoka,"Baloo 2",system-ui,sans-serif;--ui:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;--note:"Patrick Hand","Comic Sans MS",cursive}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#191530;--paper:#2a2446;--paper2:#352e56;--ink:#f6f1ff;--soft:#c3bbdb;--line:#0b0918;--pen:#c2b3ff;--good:#7fe0a8;--warn:#f4cf7c;--bad:#ff9fb0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#191530;--paper:#2a2446;--paper2:#352e56;--ink:#f6f1ff;--soft:#c3bbdb;--line:#0b0918;--pen:#c2b3ff;--good:#7fe0a8;--warn:#f4cf7c;--bad:#ff9fb0;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="midnatt"]{--bg:#201436;--paper:#322353;--paper2:#3e2e63;--ink:#fff1e8;--soft:#d6c7d6;--line:#100a20;--pen:#ffb38a;--good:#84e0b4;--warn:#ffcf7a;--bad:#ff9f9f;color-scheme:dark}
:root[data-theme="skog"]{--bg:#142619;--paper:#213829;--paper2:#2b4534;--ink:#eef5ec;--soft:#b8cdb9;--line:#08120c;--pen:#b7df8c;--good:#8fe0a8;--warn:#f0cc78;--bad:#f7a8a0;color-scheme:dark}
:root[data-theme="hav"]{--bg:#d9eff7;--paper:#fbffff;--paper2:#e8f4f7;--ink:#0c2b38;--soft:#3f5c69;--line:#0c2b38;--pen:#07607f;--good:#0d6349;--warn:#6f4706;--bad:#a82838;color-scheme:light}
:root[data-theme="norrsken"]{--bg:#0a1020;--paper:#172238;--paper2:#202d47;--ink:#eaf6ff;--soft:#afc6d7;--line:#02050c;--pen:#6fe7c8;--good:#79e6bd;--warn:#efcf7e;--bad:#f6a2ae;color-scheme:dark}
:root[data-theme="korsbar"]{--bg:#ffe6ee;--paper:#fffafb;--paper2:#fbeef2;--ink:#34121f;--soft:#664250;--line:#34121f;--pen:#b3125a;--good:#17684a;--warn:#71480a;--bad:#a8202f;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Everything is drawn a little smaller, so more fits on the screen. One number sets the whole app. */
html{height:100%;zoom:.86}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:600 17px/1.45 var(--ui);overflow-x:hidden;padding-block:0 calc(104px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.hide{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,textarea{font:inherit;color:var(--ink);min-width:0;background:none}
input::placeholder,textarea::placeholder{color:var(--soft);opacity:1;font-weight:600}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield;appearance:textfield}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
main{max-width:620px;margin:0 auto}
section{min-width:0;animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:translateY(12px) scale(.985);opacity:.4}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;min-height:60px;margin-inline:-6px;padding-inline:6px;background:var(--bg)}
.menu{width:44px;height:44px;display:grid;place-items:center;grid-column:1;grid-row:1;border-radius:14px}
.menu svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.top.bk #menu{display:none}.top #back{display:none}.top.bk #back{display:grid}
h1{grid-column:2;grid-row:1;margin:0;text-align:center;font:600 25px/1.1 var(--hand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Search and small helpers */
.srch{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:20;display:block;margin:0 -6px 10px;padding:2px 6px 8px;background:var(--bg)}
.srch>svg{position:absolute;left:21px;top:16px;width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;pointer-events:none}
.srch input{width:100%;height:50px;padding:0 46px;border:2px solid var(--line);border-radius:18px;background:var(--paper);font-size:17px}
.srch input:focus{outline:0;box-shadow:0 0 0 3px var(--pen)}.srch input::-webkit-search-cancel-button{display:none}
.srch .x{position:absolute;right:15px;top:11px}
.x{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--soft)}.x svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;fill:none}
.quick{display:flex;gap:8px;margin-bottom:14px}.quick .pill{flex:1}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:6px 14px;border:2px solid var(--line);border-radius:99px;background:var(--paper);font-weight:800;font-size:15.5px;white-space:nowrap}
.pill svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.pill.on{background:var(--ink);color:var(--bg)}
.pill .bdg{display:grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:var(--pen);color:var(--bg);font-size:13px}
.expl{margin:-4px 0 12px;padding:9px 13px;background:var(--sticky);color:var(--on);border:2px solid var(--line);border-radius:14px;font-size:14.5px;transform:rotate(-.5deg)}.expl button{font-weight:800;text-decoration:underline;text-underline-offset:2px}
.hits{margin:2px 0 10px;font-size:15px;color:var(--soft)}

/* The sheets */
.holes{position:absolute;left:13px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-evenly;pointer-events:none}
.holes b{display:block;width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.pile{display:flex;flex-direction:column;padding-bottom:18px}
.ark{position:sticky;top:calc(env(safe-area-inset-top,0px) + 122px + var(--i)*4px);z-index:calc(var(--i) + 1);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:8px;width:100%;min-height:180px;margin-top:-30px;padding:20px 16px 46px 46px;background:var(--a);color:var(--on);border:2px solid var(--line);border-radius:24px;text-align:left;transform:rotate(var(--r));transition:transform .2s cubic-bezier(.2,1.5,.4,1)}
.ark:first-child{margin-top:0}
.ark:active{transform:rotate(0) scale(.98)}
.ark h3{margin:0;font:600 clamp(32px,10vw,44px)/1.02 var(--hand);overflow-wrap:break-word}
.ark .holes{bottom:30px}
.ark .cnt{display:inline-block;margin-top:9px;padding:2px 12px;border:2px solid var(--on);border-radius:99px;background:rgba(255,255,255,.6);font-weight:800;font-size:14.5px}
.dood{width:92px;height:92px;fill:rgba(255,255,255,.62);stroke:var(--on);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform:rotate(-6deg);flex:none}
@media (hover:hover){.ark:hover{transform:rotate(0) translateY(-3px)}.rk:hover,.pill:hover,.btn:hover{transform:translate(-1px,-1px)}}

/* A category */
.cath{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:18px 16px 18px 46px;background:var(--a);color:var(--on);border:2px solid var(--line);border-radius:24px;transform:rotate(-.5deg)}
.cath h2{margin:0;font:600 38px/1.05 var(--hand);overflow-wrap:break-word}.cath .cnt{font-weight:800;font-size:15px}.cath .dood{width:72px;height:72px}
.easy{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.easy .pill{flex:1 1 auto}
.rks{display:grid;gap:10px}
.rk{position:relative;display:grid;grid-template-columns:50px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:10px 13px 10px 10px;background:var(--paper);border:2px solid var(--line);border-radius:18px;text-align:left;transition:transform .15s}
.rk .dot{display:grid;place-items:center;width:50px;height:50px;border:2px solid var(--line);border-radius:15px;background:var(--a);color:var(--on)}.rk .dot svg{width:32px;height:32px;fill:rgba(255,255,255,.62);stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rk b{display:block;font:500 20px/1.15 var(--hand);overflow-wrap:anywhere}.rk small{display:block;color:var(--soft);font-size:14.5px;margin-top:1px}.rk mark{background:none;color:var(--pen);font-weight:800}
.rkm{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:14.5px;font-weight:800;color:var(--soft);white-space:nowrap}
.star{width:19px;height:19px;fill:#e0364f;stroke:var(--line);stroke-width:1.8;display:block}
.empty{text-align:center;padding:26px 14px;background:var(--paper);border:2px dashed var(--line);border-radius:20px}.empty b{display:block;font:600 24px/1.2 var(--hand);margin-bottom:4px}.empty span{color:var(--soft);display:block}.empty .btn{margin-top:14px}.empty .lnk{margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:10px 20px;border:2px solid var(--line);border-radius:16px;background:var(--pen);color:var(--bg);font:600 18px/1.1 var(--hand);transition:transform .15s}
.btn.out{background:var(--paper);color:var(--ink)}
.lnk{min-height:44px;padding:8px 0;color:var(--pen);font-weight:800;text-decoration:underline;text-underline-offset:3px}

/* A recipe sheet and the blank sheet */
.rpage{position:relative;padding:20px 18px 22px 46px;background:var(--paper);border:2px solid var(--line);border-radius:24px;margin-top:4px}
.rhead{min-height:122px;margin:-20px -18px 16px -46px;padding:18px 62px 18px 46px;background:var(--a);color:var(--on);border-bottom:2px solid var(--line);border-radius:20px 20px 0 0;position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.rhead .cat{display:inline-block;padding:1px 11px;border:2px solid var(--on);border-radius:99px;background:rgba(255,255,255,.6);font-weight:800;font-size:14px}
.rhead h2{margin:10px 0 0;font:600 clamp(31px,9.8vw,40px)/1.08 var(--hand);letter-spacing:-.005em;overflow-wrap:break-word;text-wrap:balance}
.squig{display:block;width:108px;height:16px;margin-top:8px}.squig path{fill:none;stroke:var(--on);stroke-width:2.200;stroke-linecap:round;stroke-linejoin:round}
.rhead .dood{width:66px;height:66px}
.heart{position:absolute;top:12px;right:12px;width:44px;height:44px;display:grid;place-items:center;border:2px solid var(--on);border-radius:50%;background:rgba(255,255,255,.72);color:var(--on)}.heart svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}.heart.on svg{fill:#e0364f}.heart.bkb{top:62px}.heart.bkb svg{stroke-linecap:round}.heart.bkb.on svg{fill:#B9A5D6}
.rfacts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.step{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:99px;background:var(--paper)}.step button{width:42px;height:40px;font-size:21px;font-weight:800}.step span{padding-inline:2px;font-weight:800;font-size:15.5px;white-space:nowrap}
h3.sec{margin:20px 0 8px;font:600 25px/1.1 var(--hand)}
.irow{display:grid;grid-template-columns:26px minmax(3.8em,auto) minmax(0,1fr);align-items:center;gap:9px;width:100%;padding:8px 0;border-bottom:2px dotted color-mix(in srgb,var(--soft) 45%,transparent);text-align:left}
.irow:last-child{border-bottom:0}.irow>i{display:grid;place-items:center;width:26px;height:26px;border:2px solid var(--line);border-radius:9px;color:transparent;background:var(--paper)}.irow>i svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.irow b{font-weight:800;overflow-wrap:anywhere}.irow span{min-width:0;overflow-wrap:anywhere}
.irow.done>i{background:#a7dd8b;color:var(--on)}.irow.done b,.irow.done span{color:var(--soft);text-decoration:line-through}
.para{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;width:100%;padding:7px 0;text-align:left}
.para u{text-decoration:none;display:grid;place-items:center;width:34px;height:34px;border:2px solid var(--line);border-radius:50%;background:var(--a);color:var(--on);font:600 18px/1 var(--hand)}
.para span{min-width:0;overflow-wrap:anywhere;padding-top:4px;font-weight:600}
.para.done u{background:#a7dd8b}.para.done span{color:var(--soft);text-decoration:line-through}
.hint{margin:6px 0 0;font-size:14.5px;color:var(--soft)}
.dnote{margin:18px 0 0;padding:12px 15px;background:var(--sticky);color:var(--on);border:2px solid var(--line);border-radius:6px 16px 6px 14px;font:400 23px/1.25 var(--note);white-space:pre-wrap;overflow-wrap:anywhere;transform:rotate(-1deg)}
.tgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.chip.tag{gap:7px;min-height:40px;padding:5px 15px 5px 11px;background:var(--a);color:var(--on);font:500 16.5px/1 var(--hand)}.chip.tag svg{width:17px;height:17px;fill:rgba(255,255,255,.62);stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ract{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.ract .del{color:var(--bad)}
.rnav{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:12px}.rnav button{min-height:46px;padding:0 6px;font-weight:800;font-size:15px;color:var(--soft);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left}.rnav button:last-child{text-align:right}.rnav button:disabled{visibility:hidden}
#d.flipn .rpage{animation:flipN .4s cubic-bezier(.2,.9,.3,1)}#d.flipp .rpage{animation:flipP .4s cubic-bezier(.2,.9,.3,1)}
@keyframes flipN{from{transform:translateX(70px) rotate(4deg);opacity:0}}@keyframes flipP{from{transform:translateX(-70px) rotate(-4deg);opacity:0}}

#f_title{display:block;width:100%;padding:0 0 8px;border:0;border-bottom:2px solid var(--line);border-radius:0;font:600 32px/1.15 var(--hand)}#f_title:focus{outline:0;border-bottom-color:var(--pen)}
#f_title::placeholder{font-weight:500}
.lab{display:block;margin:18px 0 8px;font:600 21px/1.1 var(--hand)}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.mini{position:relative;display:grid;justify-items:center;gap:0;padding:8px 2px 7px;background:var(--a);color:var(--on);border:2px solid var(--line);border-radius:14px;font-weight:800;font-size:13.5px;transition:transform .15s}.mini svg{width:34px;height:34px;fill:rgba(255,255,255,.62);stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mini.on{transform:scale(1.04);box-shadow:0 0 0 3px var(--pen)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.two label{font-size:14.5px;font-weight:800;color:var(--soft)}.two input{display:block;width:100%;height:48px;margin-top:3px;padding:0 13px;border:2px solid var(--line);border-radius:14px;background:var(--paper)}
.fin{display:block;width:100%;height:48px;margin-top:9px;padding:0 13px;border:2px solid var(--line);border-radius:14px;background:var(--paper)}
.two input:focus,.fin:focus,textarea.fin:focus{outline:0;box-shadow:0 0 0 3px var(--pen)}
textarea.fin{height:auto;min-height:92px;padding:10px 13px;background:var(--sticky);color:var(--on);font:400 22px/1.25 var(--note);resize:vertical}textarea.fin::placeholder{color:#6b5a2c}
.lnw{margin-top:7px;padding:0 6px 0 12px;border:2px solid var(--line);border-radius:14px;background:var(--paper)}.lnw:focus-within{box-shadow:0 0 0 3px var(--pen)}
.ln{display:grid;align-items:center;gap:7px}.ln input{border:0;height:44px;padding:0;width:100%}.ln input:focus,.ln textarea:focus{outline:0}
.ln.ing{grid-template-columns:4.8em minmax(0,1fr) 32px}.ln.ing .q{font-weight:800}
.ln.stp{grid-template-columns:22px minmax(0,1fr) 32px;align-items:start;padding-block:8px}.ln.stp u{text-decoration:none;font:600 18px/1.4 var(--hand);color:var(--pen)}.ln.stp textarea{display:block;width:100%;border:0;padding:1px 0 0;min-height:28px;resize:none;overflow:hidden;font-weight:600}
.lnk[data-add]{display:block;width:100%;margin-top:8px;padding:10px;min-height:46px;border:2px dashed var(--line);border-radius:14px;text-align:center;text-decoration:none;color:var(--ink)}
.pnote{margin:-2px 0 2px;font-size:14.5px;color:var(--soft)}
.acts{display:grid;grid-template-columns:1fr 2fr;gap:9px;margin-top:22px}

/* Goes well with */
.recs{margin-top:22px;padding-top:4px;border-top:2px dotted color-mix(in srgb,var(--soft) 45%,transparent)}
.rech{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 0 10px}.rech h3.sec{margin:0}
.recs .rk{background:var(--paper2)}

/* Shared recipes: links taped in like clippings */
#l_form{margin-top:4px}
.det{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:3px 12px;border:2px solid var(--line);border-radius:99px;background:var(--paper2);font-weight:800;font-size:15px}.det svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lks{display:grid;gap:22px;padding-top:12px}
.lk{position:relative;padding:20px 16px 12px;background:var(--a);color:var(--on);border:2px solid var(--line);border-radius:20px;transform:rotate(var(--r));min-width:0}
.lk::before{content:"";position:absolute;top:-12px;left:50%;width:86px;height:24px;margin-left:-43px;background:rgba(255,255,255,.62);border:2px solid var(--line);border-radius:4px;transform:rotate(-2deg)}
.lkh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.plat,.lk .cat{display:inline-flex;align-items:center;gap:6px;padding:2px 11px;border:2px solid var(--on);border-radius:99px;background:rgba(255,255,255,.6);font-weight:800;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.plat svg{flex:none;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lk h3{margin:10px 0 0;font:600 26px/1.12 var(--hand);overflow-wrap:break-word}
.lkn{margin:6px 0 0;font:400 21px/1.22 var(--note);white-space:pre-wrap;overflow-wrap:anywhere}
.lka{display:flex;align-items:center;gap:8px;margin-top:12px}.lka .btn{flex:1;text-decoration:none;background:var(--on);color:#fffdf8;border-color:var(--on)}.lka .pill{background:rgba(255,255,255,.72);color:var(--on);border-color:var(--on)}.lka .x{color:var(--on);width:44px;height:44px}
.lk small{display:block;margin-top:8px;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Home */
#o{display:flex;flex-direction:column;gap:14px;padding-top:2px}
.osec h3.sec{margin:6px 0 10px}
.top.home h1{font-size:30px}
.vine{display:block;width:100%;max-width:430px;height:auto;margin:0 auto}
.vine .s{fill:none;stroke:var(--ink);stroke-width:2.200;stroke-linecap:round;stroke-linejoin:round}.vine .l{stroke:var(--on);stroke-width:2;stroke-linejoin:round}.vine .a{fill:#CBDDA0}.vine .b{fill:#B9DCCB}.vine .v{fill:none;stroke:var(--on);stroke-width:1.500;stroke-linecap:round}
.hc{position:relative;padding:16px;color:var(--on);border:2px solid var(--line);border-radius:24px;min-width:0}
.hct{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.hct h3{display:flex;align-items:center;gap:8px;margin:0;font:600 25px/1.1 var(--hand)}
.hh2{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2.100;stroke-linejoin:round}

  if(d.sx!=null){const i=+d.sx,at=ED.steps[i].trim()?i+1:i;ED.steps.splice(at,at===i?1:0,...L.map(s=>s.replace(/^\s*(?:steg\s*|step\s*)?\d+\s*[.):]\s*/i,"")))}
  else{const i=+(d.in!=null?d.in:d.iq),cur=ED.ings[i],at=cur.q.trim()||cur.n.trim()?i+1:i;ED.ings.splice(at,at===i?1:0,...L.map(splitLine))}
  keepDraft();buildRows();toast(t("tSplit",L.length))});

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);if(g.dataset.to)setTimeout(()=>focusTo(g.dataset.to),60);return}
  const o=e.target.closest("[data-open]");if(o){open_(o.dataset.open);return}
  if(e.target.closest("#d_prev")){turn(-1);return}if(e.target.closest("#d_next")){turn(1);return}
  const k=e.target.closest("[data-kat]");if(k){openCat(k.dataset.kat);return}
  if(e.target.closest("#d_shop")){const r=R.find(x=>x.id===CUR);if(!r)return;if(SHOPS.some(x=>x.rid===r.id))go("i");else createShop(r);return}
  const si=e.target.closest("[data-si]");if(si){const[a,b]=si.dataset.si.split("|"),l=SHOPS.find(x=>x.id===a);if(l&&l.items[+b]){l.items[+b].done=!l.items[+b].done;renderShops();saveShop(l)}return}
  const sd=e.target.closest("[data-sdel]");if(sd){const l=SHOPS.find(x=>x.id===sd.dataset.sdel);if(l)removeShop(l);return}
  const nw=e.target.closest("[data-news]");if(nw){addNews(nw.dataset.news);return}
  const lfc=e.target.closest("[data-lfc]");if(lfc){LE.cat=lfc.dataset.lfc;paintLinkCats();return}
  if(e.target.closest("#l_save")){saveLink();return}
  if(e.target.closest("#l_no")){LE=blankL();buildLinkForm();return}
  const led=e.target.closest("[data-led]");if(led){const l=LINKS.find(x=>x.id===led.dataset.led);if(l){LE={...l};buildLinkForm();window.scrollTo(0,0);$("l_title").focus()}return}
  const ldel=e.target.closest("[data-ldel]");if(ldel){const l=LINKS.find(x=>x.id===ldel.dataset.ldel);if(l)removeLink(l);return}
  if(e.target.closest("#d_link")){openLinkSheet();return}
  const lk=e.target.closest("[data-lk]");if(lk){const r=R.find(x=>x.id===CUR);if(r)toggleLink(r,lk.dataset.lk);return}
  const fc=e.target.closest("[data-fc]");if(fc){ED.cat=fc.dataset.fc;keepDraft();buildCats();return}
  const so=e.target.closest("[data-sort]");if(so){SORT=so.dataset.sort;renderList();return}
  if(e.target.closest("#r_filter")){renderFilter();$("fs").classList.add("on");return}
  if(e.target.closest("#fs_ok")||e.target===$("fs")){$("fs").classList.remove("on");return}
  if(e.target.closest("#fs_clear")){resetFilters();renderFilter();renderList();return}
  if(e.target.closest("#r_clear")){resetFilters();renderList();return}
  const ft=e.target.closest("[data-ft]");if(ft){FT=+ft.dataset.ft;renderFilter();renderList();return}
  const fb=e.target.closest("[data-fb]");if(fb){if(fb.dataset.fb==="fav")FFAV=!FFAV;else FNEW=!FNEW;renderFilter();renderList();return}
  const fg=e.target.closest("[data-fg]");if(fg){const g=fg.dataset.fg;FTAGS.has(g)?FTAGS.delete(g):FTAGS.add(g);renderFilter();renderList();return}
  const nc=e.target.closest("[data-newcat]");if(nc){ED=DRAFT;if(nc.dataset.newcat)DRAFT.cat=nc.dataset.newcat;keepDraft();buildForm();go("n");return}
  const tg=e.target.closest("[data-tag]");if(tg){Q=tg.dataset.tag;$("q").value=Q;go("h");return}
  const ad=e.target.closest("[data-add]");if(ad){if(ad.dataset.add==="ing"){ED.ings.push({q:"",n:""});keepDraft();buildRows("iq_"+(ED.ings.length-1))}else{ED.steps.push("");keepDraft();buildRows("st_"+(ED.steps.length-1))}return}
  const di=e.target.closest("[data-di]");if(di){ED.ings.splice(+di.dataset.di,1);if(!ED.ings.length)ED.ings.push({q:"",n:""});keepDraft();buildRows();return}
  const ds=e.target.closest("[data-ds]");if(ds){ED.steps.splice(+ds.dataset.ds,1);if(!ED.steps.length)ED.steps.push("");keepDraft();buildRows();return}
  const ic=e.target.closest("[data-ic]");if(ic){const i=+ic.dataset.ic;CI.has(i)?CI.delete(i):CI.add(i);renderDetail();return}
  const st=e.target.closest("[data-st]");if(st){const i=+st.dataset.st;CS.has(i)?CS.delete(i):CS.add(i);renderDetail();return}
  const r=R.find(x=>x.id===CUR);
  if(r&&e.target.closest("#d_fav,#d_fav2")){toggleFav(r);return}
  if(r&&e.target.closest("#d_edit")){openEdit(r);return}
  if(r&&e.target.closest("#d_del")){removeRec(r);return}
  if(r&&e.target.closest("#d_cook")){toggleCooked(r);return}
  if(e.target.closest("#d_wake")){wake(!WANT);return}
  if(r&&e.target.closest("#d_less")){DP2=Math.max(1,DP2-1);renderDetail();return}
  if(r&&e.target.closest("#d_more")){DP2=Math.min(99,DP2+1);renderDetail();return}
  const th=e.target.closest("[data-th]");if(th){S.theme=th.dataset.th;applyTheme();persist();renderSettings();return}
  const lg=e.target.closest("[data-lang]");if(lg){S.lang=lg.dataset.lang;persist();applyLang();$("ttl").textContent=ttlOf(tab);return}
  for(const[a,key]of[["tg","toasts"],["sn","sound"],["ck","click"],["mo","motion"]]){const b=e.target.closest(`[data-${a}]`);if(b){S[key]=b.dataset[a]==="1";persist();renderSettings();if(key==="motion")keepMotion();return}}
});
const isoOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function focusTo(sel){const el=document.querySelector(sel);if(!el)return;const d=el.matches("details")?el:el.closest("details");if(d)d.open=true;if(!el.getClientRects().length)return;el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1600)}

/* Turning the pages: swipe on a phone, arrow keys on a computer. */
let SW=null;
$("d").addEventListener("touchstart",e=>{if(e.touches.length===1)SW=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});
$("d").addEventListener("touchend",e=>{if(!SW)return;const c=e.changedTouches[0],dx=c.clientX-SW[0],dy=c.clientY-SW[1];SW=null;if(Math.abs(dx)>70&&Math.abs(dx)>1.8*Math.abs(dy))turn(dx<0?1:-1)},{passive:true});
document.addEventListener("keydown",e=>{if(tab!=="d"||e.altKey||e.ctrlKey||e.metaKey||e.target.closest("input,textarea")||document.querySelector("#modal.on,#fs.on"))return;if(e.key==="ArrowRight")turn(1);else if(e.key==="ArrowLeft")turn(-1)});


seedExample();applyTheme();applyLang();let startTab="o";try{const s=sessionStorage.getItem("matkoll.tab");if(s&&"ohnsicv".includes(s))startTab=s}catch(e){}go(startTab);
/* One shared recipe collection, so everyone with the page sees the same recipes. The page works without storage. */
(async()=>{try{
  const db=await claude.use("db");if(!db)return;
  col=db.collection("household");renderSettings();
  col.onSnapshot(snap=>{
    const real=snap.docs.some(d=>/^rec_|^started$/.test(d.id));allIds=snap.docs.map(d=>d.id);const old=S.lang,list=[],lnk=[],shp=[];
    snap.docs.forEach(d=>{const v=d.data()||{};
      if(d.id==="plan"){if(typeof v.theme==="string")S.theme=v.theme;["toasts","sound","click","motion"].forEach(k=>{if(typeof v[k]==="boolean")S[k]=v[k]});keepMotion();if(typeof v.portions==="number"&&v.portions>0)S.portions=v.portions;if(v.lang==="sv"||v.lang==="en")S.lang=v.lang}
      else if(v.kind==="rec"&&v.id)list.push(normR(v));
      else if(v.kind==="link"&&v.id){const l=normL(v);if(l)lnk.push(l)}
      else if(v.kind==="shop"&&v.id)shp.push(normS(v))});
    SD.forEach((l,id)=>{const i=shp.findIndex(x=>x.id===id);if(l===null){if(i>=0)shp.splice(i,1)}else if(i>=0)shp[i]=l;else shp.push(l)});SHOPS=shp;
    LP.forEach((l,id)=>{const i=lnk.findIndex(x=>x.id===id);if(l===null){if(i>=0)lnk.splice(i,1)}else if(i>=0)lnk[i]=l;else lnk.push(l)});LINKS=lnk;
    /* Changes still on their way to storage win over an older snapshot. */
    if(real){exampleMode=false;DIRTY.forEach((r,id)=>{const i=list.findIndex(x=>x.id===id);if(r===null){if(i>=0)list.splice(i,1)}else if(i>=0)list[i]=r;else list.push(r)});R=list}
    else if(!exampleMode&&!DIRTY.size)seedExample();
    applyTheme();if(S.lang!==old){applyLang();$("ttl").textContent=ttlOf(tab);return}render()},()=>{col=null;render()});
}catch(e){}})();
</script>
